name: Voltage
options:
  bundleIdPrefix: com.voltage
targets:
  Voltage:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [HomeView.swift, Theme.swift, VoltageApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voltage.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voltage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
