workflows:
  ios-testflight:
    name: Voltage iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: voltage-key
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.watchvoltage.app
    scripts:
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/" project.yml
      - name: Make app icon
        script: python3 make_icon.py
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "Voltage.xcodeproj" --scheme "Voltage"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
