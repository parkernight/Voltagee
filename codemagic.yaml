workflows:
  ios-testflight:
    name: Voltage iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: voltage-key
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/" project.yml
      - name: Make app icon
        script: python3 make_icon.py
      - name: Download fonts
        script: |
          mkdir -p Fonts
          curl -fL -o Fonts/BebasNeue-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf" || echo "Bebas download failed"
          curl -fL -o Fonts/Outfit.ttf "https://github.com/google/fonts/raw/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || echo "Outfit download failed"
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.watchvoltage.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "Voltage.xcodeproj" --scheme "Voltage"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
