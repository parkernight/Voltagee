workflows:
  ios-testflight:
    name: Voltage iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: voltage-key
    environment:
      xcode: latest
    scripts:
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/" project.yml
      - name: Make app icon
        script: python3 make_icon.py
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "com.watchvoltage.app" --type IOS_APP_STORE --create --certificate-key @file:/tmp/cert_key
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "Voltage.xcodeproj" --scheme "Voltage"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
